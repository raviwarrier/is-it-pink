version: '3.8'

services:
  is-it-pink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: is-it-pink
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      # Optional: Mount your host audiobook folder to scan locally
      - /path/to/your/audiobooks:/media/audiobooks:ro
